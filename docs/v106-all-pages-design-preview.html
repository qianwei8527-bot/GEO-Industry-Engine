<style>
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel2: #f1f4f8;
    --text: #17233d;
    --muted: #5b6b84;
    --border: #d8e0ea;
    --primary: #0b63e6;
    --primary-weak: #e8f0fe;
    --primary-strong: #084aa8;
    --success: #16824a;
    --success-weak: #e7f5ec;
    --warning: #9a6500;
    --warning-weak: #fdf3df;
    --danger: #c93442;
    --danger-weak: #fdebec;
    --inferred: #6c4cf6;
    --inferred-weak: #f0ecfe;
    --radius: 8px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font: inherit; }
  .app {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 264px;
    flex: 0 0 264px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .brand b { font-size: 15px; }
  .brand span { display: block; color: var(--muted); font-size: 11px; }
  .nav-wrap { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .nav-group { margin-top: 14px; }
  .nav-group:first-child { margin-top: 0; }
  .nav-title {
    padding: 4px 8px;
    color: var(--text);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0;
  }
  .nav-subtitle {
    padding: 6px 8px 4px 20px;
    color: #d97706;
    font-size: 12px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 2px;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    font-size: 11px;
  }
  .nav-item:hover { background: var(--panel2); }
  .nav-item.active { background: var(--primary-weak); color: var(--primary-strong); font-weight: 500; }
  .sidebar-foot {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .crumb { color: var(--muted); font-size: 13px; }
  .crumb b { color: var(--text); font-weight: 500; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .preview-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--warning);
    background: var(--warning-weak);
  }
  .search {
    min-width: 200px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel2);
    color: var(--muted);
    font-size: 12px;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--primary-weak);
    color: var(--primary-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .page { max-width: 1120px; margin: 0 auto; }
  .page-head { margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--panel);
  }
  .chip.green { background: var(--success-weak); color: var(--success); border-color: transparent; }
  .chip.amber { background: var(--warning-weak); color: var(--warning); border-color: transparent; }
  .chip.red { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .chip.purple { background: var(--inferred-weak); color: var(--inferred); border-color: transparent; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 14px 16px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat b { display: block; font-size: 24px; font-weight: 700; margin-top: 4px; }
  .panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 18px; margin-bottom: 16px; }
  .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .panel-title h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel-title span { color: var(--muted); font-size: 12px; }
  .cols { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 16px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel);
    margin-bottom: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .dot.green { background: var(--success); }
  .dot.amber { background: var(--warning); }
  .dot.red { background: var(--danger); }
  .dot.purple { background: var(--inferred); }
  .row b { font-size: 13px; font-weight: 500; }
  .row span { color: var(--muted); font-size: 12px; }
  .row .grow { flex: 1; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .tile { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); padding: 14px; }
  .tile b { font-size: 13px; font-weight: 500; }
  .tile span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .tile .badge { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .canvas {
    min-height: 300px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--panel2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--panel);
    white-space: nowrap;
  }
  .badge.green { background: var(--success-weak); color: var(--success); border-color: transparent; }
  .badge.amber { background: var(--warning-weak); color: var(--warning); border-color: transparent; }
  .badge.red { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  .badge.purple { background: var(--inferred-weak); color: var(--inferred); border-color: transparent; }
  .statusbar {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
  }
  .statusbar b { color: var(--text); font-weight: 500; }
  @media (max-width: 900px) {
    .sidebar { width: 220px; flex-basis: 220px; }
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cols, .grid, .grid-3 { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .topbar { padding: 0 16px; }
  }
  @media (max-width: 640px) {
    .app { flex-direction: column; }
    .sidebar { width: auto; flex: 0 0 auto; border-right: none; border-bottom: 1px solid var(--border); max-height: 260px; }
    .nav-wrap { display: flex; flex-wrap: wrap; }
    .nav-group { width: 100%; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>

function esc(value) {
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function chip(text, tone) {
  return `<span class="chip ${tone || ""}">${esc(text)}</span>`;
}

function renderSection(section) {
  if (section.kind === "stats") {
    return `<div class="stats">${section.items.map((item) => `<div class="stat"><span>${esc(item.label)}</span><b>${esc(item.value)}</b></div>`).join("")}</div>`;
  }
  if (section.kind === "panel") {
    const rows = (section.rows || []).map((row) => `
      <div class="row">
        <span class="dot ${row.tone || ""}"></span>
        <div class="grow"><b>${esc(row.title)}</b><br><span>${esc(row.desc || "")}</span></div>
        ${row.badge ? `<span class="badge ${row.badgeTone || ""}">${esc(row.badge)}</span>` : ""}
      </div>`).join("");
    return `<section class="panel"><div class="panel-title"><h2>${esc(section.title)}</h2><span>${esc(section.note || "")}</span></div>${rows}</section>`;
  }
  if (section.kind === "cols") {
    return `<div class="cols">${section.left.map(renderSection).join("")}${section.right.map(renderSection).join("")}</div>`;
  }
  if (section.kind === "grid" || section.kind === "grid-3") {
    const cls = section.kind === "grid-3" ? "grid-3" : "grid";
    return `<div class="${cls}">${section.items.map((item) => `<div class="tile"><b>${esc(item.title)}</b><span>${esc(item.desc || "")}</span>${item.badge ? `<div class="badge ${item.tone || ""}">${esc(item.badge)}</div>` : ""}</div>`).join("")}</div>`;
  }
  if (section.kind === "table") {
    return `<section class="panel"><div class="panel-title"><h2>${esc(section.title)}</h2><span>${esc(section.note || "")}</span></div><div style="overflow-x:auto"><table><thead><tr>${section.headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${section.rows.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
  }
  return "";
}

function buildNav() {
  const nav = document.getElementById("navWrap");

  SURFACES.forEach((surface) => {
    let section = sections.find((item) => item.name === surface.section);
    if (!section) {
      section = { name: surface.section, surfaces: [] };
      sections.push(section);
    }
    section.surfaces.push(surface);
  });
  nav.innerHTML = sections
    .map(
      (section) => `
      <div class="nav-group">
        <div class="nav-title">${esc(section.name)}</div>
        ${section.surfaces
          .map(
            (surface) => `
          <div class="nav-subtitle">${esc(surface.label)}</div>
          ${surface.pages
            .map(
              (page) =>
                `<button class="nav-item" data-page="${page.id}" data-surface="${surface.id}">${esc(page.label)}</button>`,
            )
            .join("")}
        `,
          )
          .join("")}
      </div>`,
    )
    .join("");

    const btn = event.target.closest(".nav-item");

    const route = REAL_ROUTES[btn.dataset.page];
    if (route) {
      window.location.href = route;
      return;
    }
    renderPage(btn.dataset.page);
  });
}

let currentMockState = "normal";

function metaFor(id) {
  return { ...PAGE_META.default, ...(PAGE_META[id] || {}) };
}

function surfaceFor(id) {
  return SURFACES.find((s) => s.pages.some((p) => p.id === id)) || {};
}

function renderMockState(state, states = CUSTOMER_STATES) {
  currentMockState = state;
  const container = document.getElementById("mockStateContent");
  if (!container) return;
  const others = Array.from(document.querySelectorAll("#content .page > *")).filter(
    (el) => !el.classList.contains("page-head") && !el.classList.contains("state-switcher"),
  );
  if (state === "normal") {
    others.forEach((el) => { el.style.display = ""; });
    container.innerHTML = "";
  } else {
    others.forEach((el) => { el.style.display = "none"; });
    container.innerHTML = states[state] || "";
  }
}

function decorate() {
  const head = document.querySelector(".page-head");
  if (!head) return;
  document.querySelectorAll(".r2-meta, .state-switcher").forEach((el) => el.remove());
  const id = currentId;
  const meta = metaFor(id);
  const surface = surfaceFor(id);
  const chips = [
    `设计状态：${meta.designStatus}`,
    `实现状态：${meta.implementationStatus}`,
    `数据模式：${meta.dataMode}`,
    `Feature Flag：${meta.featureFlag}`,
    `taskId：${meta.taskId}`,
    `release：${meta.release}`,
    `lastUpdated：${meta.lastUpdated}`,
  ];
  if (meta.realRoute) chips.push(`真实路由：${meta.realRoute}`);
  if (surface.id === "midplatform" || surface.id === "backend") {
    chips.push("内部架构设计视图");
  }
  if (meta.implementationStatus === "skeleton") {
    chips.push("骨架模式", "Mock 示例数据", "待真实接口接入");
  }
  if (meta.implementationStatus === "acceptance_blocked") {
    chips.push("验收暂缓", "不能冻结、部署或使用真实客户数据");
  }
  if (meta.implementationStatus === "not-started") {
    chips.push("规划中", "未实现", "Feature Flag：hidden/reserved");
  }
  const metaDiv = document.createElement("div");
  metaDiv.className = "r2-meta tags";
  metaDiv.innerHTML = chips.map((text) => `<span class="chip amber">${esc(text)}</span>`).join("");
  head.appendChild(metaDiv);

  if (id === "owner-customers") {
    const bar = document.createElement("div");
    bar.className = "state-switcher";
    bar.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <span style="font-size:12px;color:var(--muted)">Mock 状态切换（仅本地数据）：</span>
        ${Object.keys(CUSTOMER_STATES).map((state) => `<button type="button" data-state="${state}" class="nav-item" style="width:auto;padding:6px 10px">${state}</button>`).join("")}
      </div>
      <div id="mockStateContent"></div>
    `;
    head.after(bar);
    bar.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-state]");
      if (btn) renderMockState(btn.dataset.state);
    });
    renderMockState("normal");
  }
  if (id === "owner-projects") {
    const bar = document.createElement("div");
    bar.className = "state-switcher";
    bar.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <span style="font-size:12px;color:var(--muted)">Mock 状态切换（仅本地数据）：</span>
        ${Object.keys(PROJECT_STATES).map((state) => `<button type="button" data-state="${state}" class="nav-item" style="width:auto;padding:6px 10px">${state}</button>`).join("")}
      </div>
      <div id="mockStateContent"></div>
    `;

    bar.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-state]");
      if (btn) renderMockState(btn.dataset.state, PROJECT_STATES);
    });
    renderMockState("normal", PROJECT_STATES);
  }
  if (id === "owner-execution") {
    const bar = document.createElement("div");
    bar.className = "state-switcher";
    bar.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">

    });
    renderMockState("normal", ISSUE_STATES);
  }
}
