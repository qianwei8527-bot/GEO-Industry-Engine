[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geo-industry-engine"
version = "0.1.0"
description = "GEO-Industry-Engine: GEO产业生态基础设施后端服务"
requires-python = ">=3.11"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Proprietary" }
authors = [{ name = "GEO-Industry-Engine Team" }]
keywords = ["geo", "industry", "ai-search", "ecosystem", "infrastructure"]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "redis==5.1.0",
    "celery==5.4.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "email-validator==2.2.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# One-time scripts and legacy scratch files are excluded from the quality gate.
# They are tracked in git history but are not part of the runtime surface.
exclude = [
    ".pytest_cache", "alembic/", "__pycache__",
    "patch1.py", "patch_step1.py", "patch_tests_b64.py",
    "tmp_10.py", "tmp_fixes.py", "_fix_suspense.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["../tests"]
addopts = "-v --tb=short"
