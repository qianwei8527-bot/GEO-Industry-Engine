name: CI - GEO-Industry-Engine

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # PR Check: fast lint-only, runs on every push/PR
  # ============================================================
  pr-check:
    name: PR Check (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend lint
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - name: Backend critical lint
          run: ruff check backend/ --select E9,F63,F7,F82

      # Frontend lint
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: pnpm/action-setup@v4
        with: { version: "9" }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm lint
      - run: cd frontend && npx tsc --noEmit

  # ============================================================
  # Backend Tests: requires PostgreSQL
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [pr-check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: geo_industry_engine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://geo_user:testpass@localhost:5432/geo_industry_engine_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://geo_user:testpass@localhost:5432/geo_industry_engine_test
        run: |
          cd backend
          pytest tests/ -v --tb=short

  # ============================================================
  # Frontend Build
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [pr-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - uses: pnpm/action-setup@v4
        with: { version: "9" }

      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm build
