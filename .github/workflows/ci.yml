name: CI - GEO-Industry-Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check backend/

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm lint
      - run: cd frontend && npx tsc --noEmit

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo_user
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: geo_industry_engine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install poetry && cd backend && poetry install --no-interaction
      - run: cd backend && DATABASE_URL=postgresql+asyncpg://geo_user:testpass@localhost:5432/geo_industry_engine_test poetry run alembic upgrade head
      - run: cd backend && DATABASE_URL=postgresql+asyncpg://geo_user:testpass@localhost:5432/geo_industry_engine_test poetry run pytest tests/ -v --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-report, path: backend/coverage.xml }

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable && cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm build