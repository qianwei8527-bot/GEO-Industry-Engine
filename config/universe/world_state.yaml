# C8.2 World State aggregation contract
# No synthetic scores. Only counts, coverage and explicit formulas.

version: "1.0.0"

scopes:
  production: [verified]
  observation: [verified, observed]
  simulation: [verified, observed, synthetic]

gap_rules:
  capability_gap: verified_demand_without_verified_supply
  trust_gap: potential_supply_without_verified_claim
  connection_gap: verified_supply_and_demand_without_production_connection
  outcome_gap: completed_connection_without_verified_outcome_claim
  semantic_gap: unmapped_facts_without_concept_mapping
