      - 无限GEO检测
      - 完整企业画像
      - 月度30份报告
      - L3专业能力认证
      - 20家企业对比
      - AI优化建议
      - 趋势预测
      - API接入(2000次/月)
      - 3个子账号
    limitations:
      - 不可白标报告
      - 不可MCP接入
      
  business:
    name: 商业版
    price_monthly: 999
    price_yearly: 9990
    description: 服务商与机构
    target: GEO服务商/投资机构
    trial_days: 14
    quota:
      reports_per_month: 200
      comparisons: 100
      api_calls_per_month: 10000
      sub_accounts: 10
      data_export_rows: 50000
    permissions:
      - browse_map
      - basic_search
      - view_score
      - generate_report
      - comparison
      - appear_in_recommend
      - priority_listing
      - data_export
      - api_access
      - white_label
      - marketplace_post
      - mcp_access
      - apply_cert_L1
      - apply_cert_L2
      - apply_cert_L3
      - apply_cert_L4
    features:
      - 全部专业版功能
      - 月度200份报告
      - L4行业权威认证
      - 白标报告
      - 优先展示
      - 100家企业对比
      - API接入(10000次/月)
      - MCP协议接入
      - 10个子账号
      - 客户管理面板
      - 批量报告生成
    limitations:
      - 不可私有化部署
      
  enterprise:
    name: 企业版
    price_monthly: null
    price_yearly: null
    description: 政府/园区/大型机构定制
    target: 政府/园区/大型企业
    contact_sales: true
    quota:
      reports_per_month: null
      comparisons: null
      api_calls_per_month: null
      sub_accounts: null
      data_export_rows: null
    permissions:
      - all
      - custom_model
      - private_deploy
      - sla_guarantee
