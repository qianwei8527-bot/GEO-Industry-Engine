# GEO-Industry-Engine 定价与套餐配置
# 可调控：套餐价格、权益、权限均可修改，热加载生效

plans:
  free:
    name: 免费探索者
    price_monthly: 0
    price_yearly: 0
    description: 探索GEO产业世界
    target: 个人探索者
    quota:
      reports_per_month: 1
      comparisons: 0
      api_calls_per_month: 0
      sub_accounts: 0
      data_export_rows: 0
    permissions:
      - browse_map
      - basic_search
      - view_public_score
      - apply_cert_L1
    features:
      - 基础产业地图浏览
      - 公开GEO评分查看
      - L1基础身份认证
      - 基础搜索
    limitations:
      - 不可深度分析
      - 不可多企业对比
      - 不可API接入
      
  growth:
    name: 成长版
    price_monthly: 99
    price_yearly: 990
    description: 个人从业者与小企业
    target: 个人从业者/小微企业
    trial_days: 14
    quota:
      reports_per_month: 5
      comparisons: 3
      api_calls_per_month: 100
      sub_accounts: 0
      data_export_rows: 500
    permissions:
      - browse_map
      - basic_search
      - view_score
      - generate_report
      - comparison
      - apply_cert_L1
      - apply_cert_L2
      - basic_data_export
    features:
      - 完整GEO检测报告
      - 个人/企业画像
      - 月度5份报告
      - L2认证申请
      - 3家企业对比
      - 基础数据导出
    limitations:
      - 不可白标报告
      - 不可多子账号
      
  pro:
    name: 专业版
    price_monthly: 299
    price_yearly: 2990
    description: 中小企业全面增长
    target: 中小企业
    trial_days: 14
    quota:
      reports_per_month: 30
      comparisons: 20
      api_calls_per_month: 2000
      sub_accounts: 3
      data_export_rows: 5000
    permissions:
      - browse_map
      - basic_search
      - view_score
      - generate_report
      - comparison
      - appear_in_recommend
      - data_export
      - api_access
      - apply_cert_L1
      - apply_cert_L2
      - apply_cert_L3
