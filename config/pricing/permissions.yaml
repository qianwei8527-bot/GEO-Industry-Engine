# 权限能力定义（可调控）
# 每个权限对应一个API中间件校验点

permissions:
  browse_map:
    name: 浏览产业地图
    description: 查看产业导航五大核心地图
    
  basic_search:
    name: 基础搜索
    description: 搜索企业/行业/能力
    
  view_public_score:
