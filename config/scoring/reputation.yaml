# GEO Universe — Reputation scoring configuration
# Layer 5 Intelligence: GEO Reputation System

version: '1.0'
description: 'GEO Reputation scoring weights and thresholds'

weights:
  capability_proof: 0.25
  real_cases: 0.20
  customer_feedback: 0.15
  certification_level: 0.15
  ecosystem_contribution: 0.10
  ai_recommendation_performance: 0.15

levels:
  - name: AAA
    min_score: 85
    description: 'Industry leader, top AI recommendation target'
  - name: AA
    min_score: 70
    description: 'Highly trusted, strong AI recommendation'
  - name: A
    min_score: 55
    description: 'Trusted, moderate AI recommendation'
  - name: B
    min_score: 40
    description: 'Building trust, emerging visibility'
  - name: C
    min_score: 0
    description: 'Entry level, needs evidence building'

dimensions:
  capability_proof:
    source: capabilities
    description: 'Verified capabilities with evidence'
  real_cases:
    source: evidence
    description: 'Documented case studies and deliverables'
  customer_feedback:
    source: transaction_reviews
    description: 'Client reviews and satisfaction scores'
  certification_level:
    source: certifications
    description: 'GEO certification tier and count'
  ecosystem_contribution:
    source: relationships
    description: 'Industry connections, partnerships, knowledge sharing'
  ai_recommendation_performance:
    source: geo_events
    description: 'How often AI recommends this entity'
