# GEO产业战略评估权重配置 (Assessment Scoring Configuration)
# 版本: v1.0 | 最后更新: 2026-07-28
# 加载方式: ConfigLoader.load('scoring', 'assessment')
# 用途: Decision Engine 核心评估模型，为检测中心提供四层报告数据
# 关联: config/scoring/visibility.yaml, geo_visibility.yaml, trust_score.yaml, opportunity.yaml

schema_version: "1.0"

# ============================================================
# 第一层: 身份与位置 (Identity & Position)
# 回答: 我是谁？在产业中排哪里？
# ============================================================
identity_position:
  weights:
    entity_completeness: 0.15      # Entity 信息完整度
    capability_score: 0.20         # 能力评分 (复用 capability_match)
    geo_visibility: 0.25           # AI可见度 (引用 geo_visibility.yaml)
    trust_score: 0.20              # 可信度 (引用 trust_score.yaml)
    industry_ranking: 0.20         # 行业排名 (引用 industry_index.yaml)
  thresholds:
    leader: 85       # 行业领导者
    strong: 70       # 强势参与者
    established: 55  # 已建立
    emerging: 40     # 新兴
    unknown: 0       # 未识别
  ranking_percentile:
    top_1: 95
    top_5: 85
    top_10: 75
    top_20: 60

# ============================================================
# 第二层: 机会发现 (Opportunity Discovery)
# 回答: 未来12个月能抓住什么？
# ============================================================
opportunity_discovery:
  weights:
    market_growth: 0.25            # 市场增长趋势
    keyword_opportunity: 0.20      # 关键词空白机会
    industry_capability_gap: 0.20  # 行业能力缺口
    competitor_blindspot: 0.15     # 竞品未覆盖区域
    trend_alignment: 0.20          # 与产业趋势对齐度
  thresholds:
    golden: 80       # 黄金机会 (立刻行动)
    strong: 65       # 强机会 (本季度规划)
    moderate: 50     # 中等机会 (半年内评估)
    weak: 35         # 弱机会 (观察)
    none: 0          # 无显著机会
  granularity:
    time_horizon_months: [3, 6, 12]
    min_data_points: 50
    confidence_threshold: 0.6

# ============================================================
# 第三层: 风险预警 (Risk Warning)
# 回答: 谁在超越我？什么在威胁我？
# ============================================================
risk_warning:
  weights:
    competitor_momentum: 0.25      # 竞品增长势头
    visibility_decline: 0.20       # AI可见度下降风险
    industry_structural_change: 0.20  # 产业结构变化
    technology_obsolescence: 0.15  # 技术淘汰风险
    data_asset_gap: 0.10           # 数据资产缺口
    policy_risk: 0.10              # 政策合规风险
  thresholds:
    red: 75          # 红色预警 (立即响应，30天内)
    orange: 60       # 橙色预警 (本月评估，60天内)
    yellow: 45       # 黄色关注 (季度review)
    green: 0         # 正常 (持续监测)
  alert_levels:
    red: { response_days: 30, escalation: "CTO/CEO" }
    orange: { response_days: 60, escalation: "部门负责人" }
    yellow: { response_days: 90, escalation: "GEO负责人" }
  tracking_window_days: 90       # 过去90天变化追踪

# ============================================================
# 第四层: 战略规划 (Strategic Roadmap)
# 回答: 该做什么？分几步？
# ============================================================
strategic_roadmap:
  phase_weights:
    data_completion: 0.30         # 补充数据资产
    certification_upgrade: 0.25   # 提升认证等级
    ecosystem_connection: 0.25    # 建立生态关系
    competitive_positioning: 0.20 # 竞争定位优化
  phases:
    1_immediate:
      label: "立即行动 (30天)"
      trigger: "分数 >= 60"
      actions: ["补充关键数据", "申请基础认证", "修正关键信息"]
    2_short_term:
      label: "短期规划 (90天)"
      trigger: "分数 >= 40"
      actions: ["完善企业画像", "建立行业关系", "发布内容资产"]
    3_medium_term:
      label: "中期发展 (180天)"
      trigger: "分数 >= 20"
      actions: ["升级认证等级", "参与产业合作", "建立影响力"]
    4_long_term:
      label: "长期战略 (365天)"
      trigger: "所有实体"
      actions: ["成为行业标准参与", "构建生态关系网", "持续优化GEO表现"]

# ============================================================
# 行业调整系数 (Industry Adjustment)
# ============================================================
industry_adjustments:
  ai_software:
    visibility_weight_multiplier: 1.3
    capability_weight_multiplier: 1.2
  education:
    evidence_weight_multiplier: 1.25
    trust_weight_multiplier: 1.15
  healthcare:
    evidence_weight_multiplier: 1.3
    trust_weight_multiplier: 1.3
    policy_risk_weight_add: 0.05
  manufacturing:
    relationship_weight_multiplier: 1.2
    capability_weight_multiplier: 1.1
  finance:
    trust_weight_multiplier: 1.4
    policy_risk_weight_add: 0.08

# ============================================================
# 计算配置 (Computation Config)
# ============================================================
computation:
  batch_size: 100
  cache_ttl_minutes: 30
  recalculate_on_event: true
  min_entities_for_ranking: 10

# ============================================================
# 版本历史
# ============================================================
version_history:
  - version: "1.0"
    date: "2026-07-28"
    changes: "初始版本: 四层评估模型完整定义"
