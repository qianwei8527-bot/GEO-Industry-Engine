    domain_authority: 0.4
    backlink_quality: 0.25
    brand_mentions: 0.2
    media_coverage: 0.15
  domain_authority_scale:
  - 0
  - 100
  high_authority_sources:
  - 政府网站 (.gov)
  - 主流媒体
  - 行业权威
  - 学术机构
evidence:
  sub_weights:
    content_quality: 0.35
    data_citation: 0.25
    third_party_review: 0.25
    certification_display: 0.15
activity:
  sub_weights:
    content_update_frequency: 0.35
    social_activity: 0.25
    news_presence: 0.25
    community_engagement: 0.15
  update_frequency_tiers:
    daily:
      score: 100
      label: 日更
    weekly:
      score: 80
      label: 周更
    monthly:
      score: 50
      label: 月更
    quarterly:
      score: 25
      label: 季更
    stale:
      score: 5
      label: 停更
