schema_version: '1.0'
weights:
  completeness: 0.3
  authority: 0.3
  evidence: 0.2
  activity: 0.2
completeness:
  sub_weights:
    website_completeness: 0.3
    directory_listing: 0.25
    platform_presence: 0.25
    structured_data: 0.2
  platforms_to_check:
  - 百度百科
  - 天眼查/企查查
  - 百度地图/高德
  - 知乎/CSDN
  - 百度企业信用
authority:
